<x-dc>
<!-- @template name="Deck" description="A twenty-one-slide presentation starter: cover, contents, dividers, columns, quadrants, a data table, SVG charts and timeline, bleed imagery, a quote and a close, on the theme's tokens" -->
<helmet>
<link rel="stylesheet" href="_ds/classical-875c2bbe-79bb-4b53-b2a2-adb68a482e77/styles.css" />
<title>Classical — deck</title>
<script src="./ds-base.js"></script>
<script src="./image-slot.js"></script>
<style>
/* Template scaffolding — slide layout and projection-scale sizing only; every
   color, font, radius and shadow comes from ../../styles.css. Change one
   number here to re-size the whole deck. */
deck-stage {
  --type-display: 140px;
  --type-title: 76px;
  --type-subtitle: 42px;
  --type-body: 36px;
  --type-small: 30px;
  --type-kicker: 24px;
  --pad-x: 144px;
  --pad-top: 104px;
  --pad-bottom: 92px;
  --page-foot-note: "Confidential — July 2026"; /* the deck-wide folio text (page furniture; see the PAGE FURNITURE note below) */
  --baseline: 52px; /* grid unit — one default-text line: the 36px Lora body at a 1.44 deck
     leading (the system's editorial "tight leading", loosened just enough for projection;
     Lora's big x-height reads a size larger than its px). 92px pad-bottom puts the pinned
     footer baseline on the 19th gridline (988) — see .meta. */
}

.slide {
  display: flex; flex-direction: column;
  background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-body);
  text-wrap: pretty; /* inherited: better breaks, no orphans on wrapped blocks */
  /* Tabular numbers (review round 3, Barron's ask) are set per class, not
     deck-wide: everywhere digits stand as figures or columns — kicker, toc,
     table, charts, meta, and the display numerals — takes "tnum"; running
     prose keeps its text figures, because Lora's tnum also substitutes
     tabular SPACES and punctuation (period 0.246em → 0.325em, measured from
     the font's GSUB), which loosens every line of prose it touches. */
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}

/* — shared pieces — */
/* Baseline grid: text sits on a 52px rhythm (--baseline) measured from the
   slide's top edge. Snapped text blocks are trimmed to their cap and baseline
   edges (text-box), so a block's bottom edge IS its last baseline and the next
   block's first baseline lands N gridlines down with
   margin-top: calc(N * var(--baseline) - 1cap). Compact rhythms (table rows,
   chart axes and ticks) sit on the 26px half-step. Review the rhythm with
   ?baselines in the URL, or press B (script in the helmet) —
   half-step lines draw fainter than full ones. */
/* Hairlines carry the structure: this system draws its page with 1px rules in
   the divider token — so this deck rules its contents rows and keeps the
   table's component rules, all ON gridlines and flush with the text edge.
   Color is applied as stroke, not fill: the charts draw outlined geometry,
   the timeline's nodes are stroked circles, and gold appears as marks and
   line work. The filled gold moments are counted and deliberate: the hero
   numeral (the one filled gold TYPE moment), the highlighted bar, and the
   current timeline node — each figure keeps exactly one solid fill. */
/* The kicker survives only as a RUNNING HEAD, the way a classical book sets
   one: on the two slides that carry no title of their own (the hero figure
   and the quote), the small gold section slug is the head's only text and
   earns its place. Everywhere a slide has a title, the eyebrow is gone —
   review round 2 cut the reflexive label-over-every-title pattern, and the
   title carries the slide (wayfinding stays with the ruled contents page and
   the dividers' ghost numerals). */
.kicker {
  position: absolute; top: calc(2 * var(--baseline) - 1cap); /* baseline on the 2nd gridline */
  left: var(--pad-x); text-box: trim-both cap alphabetic;
  font-size: var(--type-kicker); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--color-accent);
  font-feature-settings: "tnum" 1; /* Lora defaults to proportional figures — columns and
     furniture take tabular (the reverse of the tabular-default decks) */
}
.slide-title {
  font-family: var(--font-heading); font-weight: 400; /* review round 3: bold retired —
     display-size text takes the normal cut (the styles.css token keeps semibold
     for interface headings, which need the weight at small sizes) */
  font-size: var(--type-title); line-height: calc(1.5 * var(--baseline)); letter-spacing: -0.01em; margin: 0;
  margin-left: -0.042em; /* optical left alignment — see the note below */
  text-box: trim-both cap alphabetic;
}
/* Optical left alignment — the deliberate exception to box-edge alignment
   the reviewed decks share, re-derived for this face (the rules generalize,
   the numbers never do — see ../../../deck-templates.md). Review round 3
   re-measured everything for the NORMAL cut, since bold is retired from
   display text: from the 400's hmtx (cross-checked against render scans),
   flat stems sit at 0.033-0.041em, rounds at 0.049em, T at 0.038em, S at
   0.067em, and the diagonals carry slightly negative bearings (A/V/W
   -0.003 to -0.004em). One value per class targets the population:
   -0.042em lands E/B/R flush within half a pixel, lets H/D overhang a
   0.009em hair, keeps rounds a 0.007em inset, and lets the diagonals
   overhang the way hand-set optical margins let pointed letters — tuned
   to the slide titles actually in the deck. Digits: review round 3 sets
   every figure and column tabular (Barron's ask — see the note at .slide),
   and this face's tnum maps its default oldstyle figures to tabular
   oldstyle (.tosf): same figure style, equal widths. Tabular bearings at 400: 0 0.042em, 1 0.129em
   (the padded tabular one), 4 0.041em, 7 0.057em. The ghost numerals
   lead with "0" and take -0.042em; the hero leads with the padded "1"
   and compensates it directly at -0.129em (a derived deck leading with
   another digit should retune that one value). Nothing hangs off a
   shifted class here except the half-bleed column offset, which folds
   the term in. */
.pin-bottom { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: var(--pad-bottom); }
.meta { display: flex; align-items: baseline; gap: 18px; font-size: var(--type-kicker); color: color-mix(in srgb, var(--color-text) 55%, transparent); font-feature-settings: "tnum" 1; /* furniture digits — see the tabular note at .slide */ }
.meta span { text-box: trim-both cap alphabetic; } /* pinned at pad-bottom: baseline lands on the 19th gridline at 988 */

/* PAGE FURNITURE — on by default. To remove the page numbers and footer
   text deck-wide, add data-no-page-furniture to the deck's <x-import>
   mount (a one-line tweak — it renders on the <deck-stage>); to change
   the text, edit --page-foot-note in
   the deck's token block. The folio sits in the book's foot margin: flush
   left on the text axis, baseline on the 20th gridline (1040) — one full
   gridline below the 988 footer line, so it never touches the vertical
   budget (the contents page closes its last rule exactly ON 988) — at the
   meta row's scale and 55% ink, the number tabular like every figure in
   this deck. Carried by the content slides (hero, quote, split and the
   half-bleeds included — on the half-bleeds it follows the copy half,
   because small muted type cannot pass the type-over-photography rule).
   The cover and close keep their meta rows instead, the full bleed's
   photograph owns its edges, and the dividers stay clean — a colophon
   page carries no folio. Every slide still counts, so the printed number
   stays truthful to position. */
deck-stage { counter-reset: page; }
.slide { counter-increment: page; }
.page-foot {
  position: absolute; left: var(--pad-x); bottom: calc(1080px - 20 * var(--baseline)); /* baseline ON the 20th gridline (1040): 40px of foot margin */
  font-size: var(--type-kicker);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
  text-box: trim-both cap alphabetic; /* bottom edge = baseline */
}
.page-foot::before { content: counter(page) " · "; font-feature-settings: "tnum" 1; /* furniture digits — see the tabular note at .slide */ }
.page-foot::after { content: var(--page-foot-note); }
deck-stage[data-no-page-furniture] .page-foot, deck-stage[data-no-page-furniture] .page-head { display: none !important; }
.half-bleed:not(.flip) .page-foot { left: calc(960px + var(--pad-x)); } /* the folio follows the copy half — type never sits on the photograph (deck-templates.md law) */

/* — cover and close — */
.cover { justify-content: center; }
.cover .rise { display: flex; flex-direction: column; gap: 42px; }
.display {
  font-family: var(--font-heading); font-weight: 400; /* the normal cut — see .slide-title */
  font-size: var(--type-display); line-height: calc(2.5 * var(--baseline)); letter-spacing: -0.015em; margin: 0;
  margin-left: -0.042em; /* optical left alignment — see the .slide-title note */
}
.cover-sub { font-size: var(--type-subtitle); line-height: var(--baseline); max-width: 38ch; margin: 0; }

/* — contents — */
/* Ruled rows — the system's hairlines carrying the structure (a style call;
   the rule-less decks space these rows with whitespace alone). Rules sit ON
   gridlines at a three-gridline pitch, flush with the text edge, and the row
   text centers its cap box between rule centerlines — the documented optical
   exception ruled rows share (see the table note below; same machinery, the
   0.5px terms are the rule's halves). */
.toc { display: flex; flex-direction: column; max-width: 1040px;
  font-size: var(--type-subtitle); border-top: 1px solid var(--color-divider); }
.toc-row { display: flex; align-items: baseline; gap: 54px;
  border-bottom: 1px solid var(--color-divider);
  padding-block: calc(1.5 * var(--baseline) - 0.5cap - 0.5px); }
.toc-row > span { text-box: trim-both cap alphabetic; }
.toc-num { font-size: var(--type-kicker); color: var(--color-accent); font-feature-settings: "tnum" 1; }

/* — section dividers — */
/* Dividers sit on a ground of their own — the shared deck contract (see
   ../../../deck-templates.md): the ground change is what makes sections read
   as breaks when flipping the deck. Classical's divider ground is a deep
   warm near-black, a colophon page: paper type and a gold section numeral,
   the engraved book's gilt-on-leather voice. Review round 3 (Barron: the
   bronze on black read too low): the ground darkens a shade below
   neutral-900 AND the gilt lightens two ramp steps to the system's own
   gold. Contrast re-derived for the darkened ground (printed values are
   per-ground): paper type 13.7:1; gilt numeral 4.5:1 (was 2.1:1). */
.divider { justify-content: center; background: color-mix(in srgb, var(--color-neutral-900) 85%, black); color: var(--color-bg); } /* review round 3 (Barron): the colophon ground darkens
   a step below neutral-900 — shade, as in the shadow tokens — so the gilt
   reads against it; re-derived: paper type 13.7:1 (was 12.6) */
.divider .rise { display: flex; flex-direction: column; align-items: flex-start; gap: 52px; }
.ghost-num {
  font-family: var(--font-heading); font-weight: 400; /* the normal cut — see .slide-title */
  font-size: 300px; line-height: 0.9; letter-spacing: -0.015em;
  color: var(--color-accent); /* review round 3 (Barron: the bronze on black read too
     low) — the gilt lightens two ramp steps to the system's own gold, 4.5:1
     on the darkened ground (was accent-700 at 2.1:1): a legible gilt figure
     rather than a ghost */
  font-feature-settings: "tnum" 1; /* tabular oldstyle — see the note at .slide */
  /* these lead with "0" — optical left alignment per the .slide-title note */
  margin-left: -0.042em;
}

/* — content slides — */
.content { padding-top: calc(4 * var(--baseline)); /* title baseline on the 4th gridline — the kicker row over titles is cut (see .kicker), so the head closes up; the first-element margins below grew a gridline each and the body rhythm holds its old gridlines */ }
.content > .slide-title, .content > .chart-head { margin-top: -1cap; } /* cap-trimmed: the baseline, not the cap top, sits on the gridline */
.content > .bullets { margin-top: calc(4 * var(--baseline) - 1cap); }
.content > .table { margin-top: calc(3 * var(--baseline)); } /* top edge on a gridline */
.content > .toc { margin-top: calc(3 * var(--baseline)); } /* ruled rows: the border-top sits on a
   gridline three below the title baseline (the title rose a gridline; the rules did not), and the
   four 3-gridline bands still close with the last rule exactly on the 988 footer gridline — the
   vertical budget, met to the pixel */
.content > figure { margin-top: calc(2 * var(--baseline)); }
.content > .chart-caption { margin-top: calc(2 * var(--baseline) - 1cap); }
.bullets { display: flex; flex-direction: column; max-width: 1200px; margin: 0; padding: 0; list-style: none; font-size: var(--type-body); }
.bullets li {
  line-height: var(--baseline); text-box: trim-both cap alphabetic;
  /* the bullet mark is type: a solid bullet in the accent — a gilt mark, the
     way this system lets gold carry small details — hung clear of the text
     axis by its own measured advance ("• " = 0.401em + 0.263em in Lora
     Regular), so wrapped lines stay flush on the axis */
  text-indent: -0.664em;
}
.bullets li::before { content: "• "; color: var(--color-accent); }
.bullets li + li { margin-top: calc(2 * var(--baseline) - 1cap); } /* every other gridline */

/* — column layouts — */
/* Columns set as the book sets them: JUSTIFIED body copy with automatic
   hyphenation — the editorial setting this system's own direction names —
   parted by a vertical hairline at each gutter's center (drawn structure
   at a whisper, the column rule of a set page; a style call — the
   whitespace decks part columns with the gutter alone). The hairline is
   ink, not gold: gold stays in marks. Cell heads take Cormorant at 48px —
   the face's low cap (0.625) reads a step smaller than its px, so the
   subtitle step would sink to body weight. Geometry: columns top on the
   312 gridline (two below the title baseline), head baselines on 364,
   body baselines from 416, all on the 52px lattice. The gutter is two
   grid units (the round-9 air rule: a drawn column rule keeps a full
   unit of air each side); with 1fr tracks the three-column widths land
   on thirds (fractional px, the charts' own precedent for horizontal
   geometry). Measures at the small size: two columns 764px, three 475px
   — about 46 and 30 characters per rendered line of running Lora,
   spaces counted — the narrow third is why the three-column copy
   stays brief. */
.cols { position: relative; display: grid; --col-gap: calc(2 * var(--baseline)); /* review round 9 (Barron): air around
     the mid-gutter hairline — two grid units, 52px each side of the rule
     (was one unit, which set the justified edge ~26px off the rule) */
  column-gap: var(--col-gap); margin-top: calc(2 * var(--baseline)); }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cols::before, .cols::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--color-divider); }
.cols-2::before { left: calc(50% - 0.5px); }
.cols-2::after { content: none; }
.cols-3::before { left: calc((100% - 2 * var(--col-gap)) / 3 + var(--col-gap) / 2 - 0.5px); }
.cols-3::after { left: calc(2 * (100% - 2 * var(--col-gap)) / 3 + 1.5 * var(--col-gap) - 0.5px); }
.cols h3 { font-family: var(--font-heading); font-weight: 400; /* the normal cut — see .slide-title */
  font-size: 48px; line-height: var(--baseline); margin: 0;
  margin-top: calc(var(--baseline) - 1cap); /* head baseline one gridline below the column top */
  text-box: trim-both cap alphabetic; }
.cols p { font-size: var(--type-small); line-height: var(--baseline); margin: 0;
  margin-top: calc(var(--baseline) - 1cap); /* first body baseline one gridline below the head's */
  text-align: justify; hyphens: auto; hyphenate-limit-chars: 6 3 3;
  text-box: trim-both cap alphabetic; }

/* — quadrants — */
/* The 2x2 matrix parted by HAIRLINES — a 1px crossing in the divider
   token (centered on its lines like the toc's rules), the vertical through
   the content center (960), the horizontal on the 572 gridline. Geometry:
   matrix top on the 312 gridline, two 4-gridline rows with a 2-gridline
   row gap; cell-head baselines on 364/676, cell lines from 416/728, matrix
   foot on 832. The axis pair prints one gridline lower (baseline 884), two
   clear of the 988 footer line, with the folio below at 1040. Left column
   = lower x; the y reading (top row more demanding) is carried by the cell
   copy — the horizontal pair does the labeling (the shared-spec minimum),
   in the kicker's quiet voice but ink, not gold: gold is for marks, and an
   axis label is furniture. */
.quad { position: relative; display: grid; grid-template-columns: 1fr 1fr;
  grid-template-rows: calc(4 * var(--baseline)) calc(4 * var(--baseline));
  gap: calc(2 * var(--baseline)) 96px; margin-top: calc(2 * var(--baseline)); }
.quad::before { content: ""; position: absolute; left: calc(50% - 0.5px); top: 0; bottom: 0; width: 1px; background: var(--color-divider); }
.quad::after { content: ""; position: absolute; top: calc(50% - 0.5px); left: 0; right: 0; height: 1px; background: var(--color-divider); }
.quad h3 { font-family: var(--font-heading); font-weight: 400;
  font-size: 48px; line-height: var(--baseline); margin: 0;
  margin-top: calc(var(--baseline) - 1cap);
  text-box: trim-both cap alphabetic; }
.quad p { font-size: var(--type-small); line-height: var(--baseline); margin: 0;
  margin-top: calc(var(--baseline) - 1cap);
  text-box: trim-both cap alphabetic; }
.quad-axis { display: flex; justify-content: space-between;
  margin-top: calc(var(--baseline) - 1cap); /* label baselines one gridline below the matrix foot (884) */
  font-size: var(--type-kicker); letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.quad-axis span { text-box: trim-both cap alphabetic; }

/* — data table (component class at projection scale) — */
.slide .table { max-width: 1560px; font-size: 30px; font-feature-settings: "tnum" 1; }
/* 104px row pitch (two gridlines): the component's own rules land on
   gridlines, and — the deliberate optical exception the ruled-row decks
   share — the cell text centers its cap box between rule centerlines (the
   collapsed 1px rules paint centered on cell boundaries at gridline-0.5px,
   hence the 0.5px terms; the cap terms cancel, so the pitch holds in any
   font). The rules themselves are the system's .table component's: this deck
   adds none of its own. */
.slide .table th, .slide .table td {
  text-box: trim-both cap alphabetic;
  padding: calc(var(--baseline) - 0.5cap - 0.5px) 28px calc(var(--baseline) - 0.5cap - 0.5px);
}
.slide .table th { font-size: var(--type-kicker); }
.slide .table tbody tr:hover { background: none; } /* a projected slide has no hover state */
.slide .table th:first-child, .slide .table td:first-child { padding-left: 0; }
.slide .table th:last-child, .slide .table td:last-child { padding-right: 0; }
.slide .table td:first-child { width: 64px; position: relative; }
/* Out of flow so its 40px box can't stretch the cap-trimmed row; centered on
   the 104px row band like the row text (the cell's padding box starts half a
   collapsed border below the row boundary, so --baseline - 20px lands the
   40px box on whole pixels at the inter-rule center). Transform-free so
   exporters that read offsets stay exact. */
.slide .table .swatch { position: absolute; left: 0; top: calc(var(--baseline) - 20px); }
.swatch { display: inline-block; width: 40px; height: 40px; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }

/* — hero figure — */
.hero { justify-content: center; gap: 42px; }
.hero-num {
  font-family: var(--font-heading); font-weight: 400; /* the normal cut — see .slide-title */
  font-size: 340px; line-height: 1; letter-spacing: -0.02em; margin: 0;
  color: var(--color-accent); /* the deck's one filled gold TYPE moment — everywhere else
     gold fills appear only as each chart's single highlight (this mono system has no second
     accent to spend) */
  font-feature-settings: "tnum" 1; /* review round 3 replaced the proportional
     opt-out that used to live here — see the tabular note at .slide */
  margin-left: -0.129em; /* the tabular oldstyle "1" pads its bearing to 0.129em —
     the hero leads with it; see the optical-alignment note */
}
.hero-caption { font-size: var(--type-small); line-height: var(--baseline); max-width: 44ch; margin: 0; }

/* — charts (static SVG on the tokens; no script, no chart library) — */
/* Engraved charts: geometry is drawn, not painted — bars are hairline-stroked
   boxes on a quiet tint, series are lines, nodes are stroked circles; the one
   solid fill is the highlighted step, in the accent. Grid and axis hairlines
   carry the divider token, solid and full-width (hairlines inside a figure
   are data furniture, like the table's rules). */
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text {
  font-family: var(--font-body); font-size: 24px;
  fill: color-mix(in srgb, var(--color-text) 55%, transparent);
  font-feature-settings: "tnum" 1; /* chart text is columns — see .kicker */
}
.chart .grid, .chart .axis { stroke: var(--color-divider); stroke-width: 1; }
.chart .bar { fill: color-mix(in srgb, var(--color-surface) 60%, transparent); stroke: var(--color-neutral-600); stroke-width: 1; }
.chart .bar-hi { fill: var(--color-accent); stroke: var(--color-accent-700); stroke-width: 1; }
.chart .val { fill: color-mix(in srgb, var(--color-text) 70%, transparent); }
.chart .ref { stroke: var(--color-accent-700); stroke-width: 1; stroke-dasharray: 8 8; }
.chart .ref-label { fill: var(--color-accent-700); }
.chart .hi-label { fill: var(--color-accent-700); }
.chart .series-a, .key .series-a { stroke: var(--color-accent); stroke-width: 3; fill: none; }
.chart .series-b, .key .series-b { stroke: var(--color-neutral-800); stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
.chart-caption { font-size: 26px; line-height: var(--baseline); max-width: 84ch; margin: 0; text-box: trim-both cap alphabetic; }
/* Chart title row — title left, legend right, sharing one baseline. */
.chart-head { display: flex; align-items: baseline; justify-content: space-between;
  font-family: var(--font-heading); font-size: var(--type-title); /* both set, so the row's 1cap
     margin resolves against the heading face — in a two-family system an inherited body font
     carries a different cap height (Lora 0.700 vs Cormorant 0.625: a 5.7px grid break at this
     size), so the -1cap idiom only ports with the family pinned */ }
.chart-legend { display: flex; align-items: baseline; gap: 16px; font-family: var(--font-body); /* back out of the head's pinned heading face */ font-size: var(--type-kicker); color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.chart-legend span { text-box: trim-both cap alphabetic; }
.chart-legend .key { width: 60px; height: 4px; overflow: visible; position: relative; top: -7px; } /* flex sits the box bottom on the baseline; the nudge lifts the key line to the label's optical center */
.chart-legend .key:not(:first-child) { margin-left: 24px; }
/* Timeline (same .chart text defaults as the other SVGs). These classes
   carry color and size only; the geometry — one left edge per column and
   the optically-set vertical cluster — is documented where it lives, in
   the pattern comment inside the timeline SVG. Nodes are stroked circles —
   drawn, not painted — with the current milestone the one filled in gold. */
.chart .tl-line { stroke: var(--color-divider); stroke-width: 1; }
.chart .tl-node { fill: none; stroke: var(--color-neutral-700); stroke-width: 1.5; }
.chart .tl-node-hi { fill: var(--color-accent); stroke: none; }
.chart .tl-date { fill: color-mix(in srgb, var(--color-text) 55%, transparent); letter-spacing: 0.08em; }
.chart .tl-date-hi { fill: var(--color-accent-700); letter-spacing: 0.08em; }
.chart .tl-label { fill: var(--color-text); font-size: 30px; }

/* — image slide — */
.split { flex-direction: row; align-items: center; gap: 96px; }
.split-copy { flex: none; width: 640px; display: flex; flex-direction: column; gap: 42px; }
.split-copy .note { font-size: var(--type-small); line-height: var(--baseline); margin: 0; }
.split-figure { min-width: 0; /* flex item: the image-slot host's intrinsic width would otherwise expand the plate past the stage (the old img exerted no width pressure) */ flex: 1; height: 780px; /* 15 gridlines — the reference photograph is a tall
   portrait plate; the fixed height keeps the mat inside the stage and crops the
   plate within it */ }
.split-figure image-slot { width: 100%; height: 100%; } /* the fixed 780px plate box does the
   framing; cover is the component's own default — no object-fit to carry */
